[package]
name = "glucose-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.49.0" }
rusqlite = { version = "0.38.0", features = ["bundled"] }
salvo = { version = "0.89.1", features = [
    "affix-state",
    "cors",
    "serve-static",
    "acme",
    "compression",
] }
serde = { version = "1.0.228", features = ["derive"] }
chrono = "0.4.43"
arc-swap = "1.8.1"
thiserror = "2.0.18"
dotenvy = "0.15.7"
postcard = { version = "1.1.3", features = ["use-std"] }
zstd = "0.13.3"
postcard-bindgen = { version = "0.7.1", features = ["std", "generating"] }
tempfile = "3.24.0"
